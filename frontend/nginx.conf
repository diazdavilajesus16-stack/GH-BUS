# Puerta de entrada de GH BUS. En Render Free los servicios upstream son públicos,
# pero el navegador solo usa este origen para API y Socket.IO.
#   /            -> aplicación React (archivos estáticos)
#   /api, /admin -> backend Django
#   /socket.io   -> servicio de tiempo real
#   /internal    -> bloqueado en la puerta pública; Django usa el endpoint HMAC de realtime

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen ${PORT};
    server_name _;
    server_tokens off;
    client_max_body_size 5m;

    resolver ${DNS_RESOLVER} valid=60s ipv6=off;
    set $backend_url "${BACKEND_URL}";
    set $backend_host "${BACKEND_HOST}";
    set $realtime_url "${REALTIME_URL}";
    set $realtime_host "${REALTIME_HOST}";

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Canal interno: nunca accesible desde fuera.
    location ^~ /internal {
        return 404;
    }

    location /api/ {
        proxy_pass $backend_url;
        proxy_ssl_server_name on;
        proxy_ssl_name $backend_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
    }

    location /admin/ {
        proxy_pass $backend_url;
        proxy_ssl_server_name on;
        proxy_ssl_name $backend_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
    }

    location /static/ {
        proxy_pass $backend_url;
        proxy_ssl_server_name on;
        proxy_ssl_name $backend_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
    }

    location /socket.io/ {
        proxy_pass $realtime_url;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $realtime_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $realtime_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier otra ruta devuelve index.html
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.html;
    }
}
