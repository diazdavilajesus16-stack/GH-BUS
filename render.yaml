services:
  - type: web
    name: ghbus-diaz16-preview-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_ENGINE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: REALTIME_HMAC_SECRET
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ghbus-diaz16-preview-api.onrender.com,localhost,127.0.0.1
      - key: USE_PROXY_HEADERS
        value: "True"
      - key: AUTH_COOKIE_SECURE
        value: "True"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: FRONTEND_URL
        value: https://ghbus-diaz16-preview-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://ghbus-diaz16-preview-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://ghbus-diaz16-preview-web.onrender.com
      - key: REALTIME_URL
        value: https://ghbus-diaz16-preview-realtime.onrender.com

  - type: web
    name: ghbus-diaz16-preview-realtime
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./realtime/Dockerfile
    dockerContext: ./realtime
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: JWT_SIGNING_KEY
        fromService:
          type: web
          name: ghbus-diaz16-preview-api
          envVarKey: JWT_SIGNING_KEY
      - key: REALTIME_HMAC_SECRET
        fromService:
          type: web
          name: ghbus-diaz16-preview-api
          envVarKey: REALTIME_HMAC_SECRET
      - key: CORS_ALLOWED_ORIGINS
        value: https://ghbus-diaz16-preview-web.onrender.com

  - type: web
    name: ghbus-diaz16-preview-web
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: PUBLIC_SCHEME
        value: https
      - key: DNS_RESOLVER
        value: 1.1.1.1
      - key: BACKEND_URL
        value: https://ghbus-diaz16-preview-api.onrender.com
      - key: BACKEND_HOST
        value: ghbus-diaz16-preview-api.onrender.com
      - key: REALTIME_URL
        value: https://ghbus-diaz16-preview-realtime.onrender.com
      - key: REALTIME_HOST
        value: ghbus-diaz16-preview-realtime.onrender.com
