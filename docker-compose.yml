# GH BUS - Docker Compose
# Arranca todo el sistema con:  docker compose up -d --build
# Solo el servicio "web" (nginx) se publica hacia el exterior; el resto vive en la red interna.
name: ghbus

services:
  db:
    image: mysql:8.4
    container_name: ghbus-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      TZ: America/Lima
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Solo accesible desde tu propia máquina (útil para `python manage.py test` en local).
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ghbus-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: ghbus-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en .env}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080}
      DB_ENGINE: mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_HOST: db
      DB_PORT: "3306"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Define JWT_SIGNING_KEY en .env}
      REALTIME_URL: http://realtime:4000
      REALTIME_HMAC_SECRET: ${REALTIME_HMAC_SECRET:?Define REALTIME_HMAC_SECRET en .env}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    expose:
      - "8000"
    networks:
      - ghbus-net

  realtime:
    build: ./realtime
    container_name: ghbus-realtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Define JWT_SIGNING_KEY en .env}
      REALTIME_HMAC_SECRET: ${REALTIME_HMAC_SECRET:?Define REALTIME_HMAC_SECRET en .env}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080}
    expose:
      - "4000"
    networks:
      - ghbus-net

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_REALTIME_URL: ""
    container_name: ghbus-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      realtime:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - ghbus-net

volumes:
  mysql_data:

networks:
  ghbus-net:
    driver: bridge
